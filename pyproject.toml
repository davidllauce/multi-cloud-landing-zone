[project]
name = "multi-cloud-landing-zone"
version = "0.1.0"
description = "Multi-cloud (AWS + GCP) landing zone foundation"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]

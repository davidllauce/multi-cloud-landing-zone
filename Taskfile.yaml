version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Bootstrap the environment (uv, pre-commit)
    cmds:
      - uv venv
      - uv sync --all-extras
      - uv run pre-commit install

  check:
    desc: Run all validations (fmt + validate + lint + scan + test + policy)
    deps: [iac:fmt, iac:validate, iac:lint, iac:scan, test, iac:test]

  iac:fmt:
    desc: Check Terraform formatting (recursive)
    dir: terraform
    cmds:
      - terraform fmt -recursive -check

  iac:validate:
    desc: Validate all root modules (0-bootstrap, 1-landing-zone, dev, stg, prd)
    dir: terraform
    cmds:
      - |
        for env in 0-bootstrap 1-landing-zone 2-environments/dev 2-environments/stg 2-environments/prd; do
          echo "==> validating $env"
          (cd "$env" && terraform init -backend=false >/dev/null && terraform validate)
        done

  iac:lint:
    desc: Lint Terraform with tflint (recursive)
    dir: terraform
    cmds:
      - tflint --recursive

  iac:scan:
    desc: Scan IaC with Checkov (security-as-code)
    dir: .
    cmds:
      - checkov -d terraform --config-file .checkov.yml --compact

  iac:plan:
    desc: Run terraform plan (dry-run) on dev (representative env)
    dir: terraform/2-environments/dev
    cmds:
      - terraform init -backend=false
      - terraform plan

  iac:policy:
    desc: Run Conftest against the fixture plan
    cmds:
      - conftest test tests/fixtures/plan_valid.json --policy terraform/modules/policy

  iac:test:
    desc: Run terraform test with mock providers (per module)
    dir: terraform/modules
    cmds:
      - |
        for m in aws-org aws-network gcp-org gcp-network; do
          echo "==> terraform test $m"
          (cd "$m" && terraform init -backend=false >/dev/null && terraform test)
        done

  iac:cost:
    desc: Estimate costs with Infracost (requires INFRACOST_API_KEY)
    dir: terraform/2-environments/dev
    cmds:
      - infracost breakdown --path . --format table

  test:
    desc: Run pytest (policy checks)
    cmds:
      - uv run pytest -q

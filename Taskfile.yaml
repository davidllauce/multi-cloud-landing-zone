version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Bootstrap the environment (uv, pre-commit)
    cmds:
      - uv venv
      - uv sync --all-extras
      - uv run pre-commit install

  check:
    desc: Run all validations (fmt + validate + lint + policy + test)
    deps: [iac:fmt, iac:validate, iac:lint, test]

  iac:fmt:
    desc: Check Terraform formatting (recursive)
    dir: terraform
    cmds:
      - terraform fmt -recursive -check

  iac:validate:
    desc: Validate all root modules (0-bootstrap, 1-landing-zone, dev, stg, prd)
    dir: terraform
    cmds:
      - |
        for env in 0-bootstrap 1-landing-zone 2-environments/dev 2-environments/stg 2-environments/prd; do
          echo "==> validating $env"
          (cd "$env" && terraform init -backend=false >/dev/null && terraform validate)
        done

  iac:lint:
    desc: Lint Terraform with tflint (recursive)
    dir: terraform
    cmds:
      - tflint --recursive

  iac:plan:
    desc: Run terraform plan (dry-run) on dev (representative env)
    dir: terraform/2-environments/dev
    cmds:
      - terraform init -backend=false
      - terraform plan

  iac:policy:
    desc: Run Conftest against the fixture plan
    cmds:
      - conftest test tests/fixtures/plan_valid.json --policy terraform/modules/policy

  iac:cost:
    desc: Estimate costs with Infracost (requires INFRACOST_API_KEY)
    dir: terraform/2-environments/dev
    cmds:
      - infracost breakdown --path . --format table

  test:
    desc: Run pytest (policy checks)
    cmds:
      - uv run pytest -q

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"
      - name: Terraform fmt (recursive)
        working-directory: terraform
        run: terraform fmt -recursive -check
      - name: Terraform validate (all environments)
        working-directory: terraform
        run: |
          for env in 0-bootstrap 1-landing-zone 2-environments/dev 2-environments/stg 2-environments/prd; do
            echo "==> validating $env"
            (cd "$env" && terraform init -backend=false && terraform validate)
          done
      - uses: terraform-linters/setup-tflint@v4
      - name: TFLint (recursive)
        working-directory: terraform
        run: tflint --recursive

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12 && uv sync --all-extras
      - name: Pytest
        run: uv run pytest -q
      - uses: open-policy-agent/setup-conftest@v2
      - name: Policy (Conftest)
        run: conftest test tests/fixtures/plan_valid.json --policy terraform/modules/policy
